name: build

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
      - name: Build
        run: make bundle
      - name: Package
        # ditto keeps the bundle's symlinks and permissions, which a plain
        # artifact upload of the .app directory would lose.
        run: ditto -c -k --keepParent dist/VoiceShim.app VoiceShim.zip
      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: VoiceShim
          path: VoiceShim.zip
